# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: cmux-list-claude-sessions

before:
  hooks:
    # Generated into completions/ (ignored by git) for the archive and the cask.
    - mkdir -p completions
    - sh -c 'go run . --completion zsh > completions/_cmux-list-claude-sessions'

builds:
  - main: .
    binary: cmux-list-claude-sessions
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/_cmux-list-claude-sessions

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Homebrew: `brews` is deprecated in favor of `homebrew_casks` (since v2.10).
homebrew_casks:
  - name: cmux-list-claude-sessions
    homepage: https://github.com/wada811/cmux-list-claude-sessions
    description: List Claude Code sessions in cmux tabs and find which one needs you
    license: MIT
    repository:
      owner: wada811
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Casks
    completions:
      zsh: completions/_cmux-list-claude-sessions
    # The binary is not signed or notarized; drop the quarantine attribute.
    # Homebrew deprecated `postflight` (what `hooks` generates) for `postflight_steps`.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr",
            args:           ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/cmux-list-claude-sessions"],
            writable_paths: ["cmux-list-claude-sessions"]
      end
