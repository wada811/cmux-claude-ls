name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The tool targets macOS only (cmux is a macOS app).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      # staticcheck 2026.2.1 is built in tools/staticcheck, a module of its own
      # that pins the x/tools needed to read Go 1.27 (see tools.go there).
      - name: staticcheck
        run: |
          go build -C tools/staticcheck -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
          "$RUNNER_TEMP/staticcheck" ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
